      api_key: os.environ/OR_API_KEY
      max_tokens: 4096

router_settings:
  num_retries: 3
  cooldown_time: 30
  allowed_fails: 1
  enable_stream_fallbacks: true
  fallbacks:
    - claude-3-5-sonnet: 
        - openrouter-catchmap1
        - openrouter-catchmap2
        - openrouter-catchmap3
        - gemini-3-8-f
        - gemini-3-p-pv
        - gemini-3-6-f
        - gemini-3-f-pv
        - gemini-3-7-f
        - gemini-3-5-fl
        - gemini-3-1-fl
        - gemini-antigravity