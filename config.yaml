model_list:
  # === 1. OpenRouter Catchmap 1 ===
  - model_name: openrouter-catchmap1
    litellm_params:
      model: openrouter/@preset/catchmap-1
      api_key: os.environ/OR_API_KEY
      max_tokens: 4096


  # === 2. OpenRouter Catchmap 2 ===
  - model_name: openrouter-catchmap2
